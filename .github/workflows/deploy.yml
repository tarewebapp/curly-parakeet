name: Validate T-ARE Website

# Deployment is NOT done here. Cloudflare Pages builds and deploys this repository
# itself through its Git integration (the "Cloudflare Workers and Pages" GitHub App):
# pushes to main go to production (https://t-areph.com), pull requests get preview URLs.
# This workflow only lints the HTML and checks links.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Run HTML validation
        run: htmlhint "**/*.html" --config .htmlhintrc || true

      - name: Link Checker
        uses: lycheeverse/lychee-action@v1
        with:
          fail: false
          args: --verbose --no-progress './**/*.html'
